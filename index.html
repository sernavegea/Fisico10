:root{
  --bg:#0d1117;--s1:#151b23;--s2:#1c242e;--s3:#253040;--line:#2a3441;
  --tx:#e6ebf1;--mut:#8a96a6;--dim:#5d6878;

  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--acc)}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:80px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label{display:block;font-size:.78rem;font-weight:600;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{max-width:820px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:15;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}

.brand b{color:var(--acc)}

.role.t{background:rgba(227,38,46,.14);color:var(--acc)}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:var(--mut)}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--s3);display:grid;place-items:center;font-weight:700;font-family:"Barlow Condensed";font-size:1rem;color:var(--tx);flex:none}
.avatar.lg{width:56px;height:56px;border-radius:14px;font-size:1.5rem}
.demo{background:rgba(78,168,255,.1);color:var(--info);font-size:.82rem;padding:8px 12px;border-radius:10px;margin-top:14px;display:flex;gap:8px;align-items:center}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:600;font-size:.9rem;margin-top:16px}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.note.bad{border-color:var(--bad)}
.note b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:3px}

.pills{display:flex;gap:6px;flex-wrap:wrap}

.pills button.on{border-color:var(--acc);color:var(--acc);background:rgba(227,38,46,.1)}

.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:.95rem}
.mut{color:var(--mut)}.sm{font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(135deg,#1e2733,#151b23);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,17,23,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:820px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--dim);border-radius:10px}

.ovl{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.7);display:flex;align-items:flex-end;justify-content:center;animation:f .15s}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:u .2s}
@media(min-width:700px){.ovl{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:1.5rem;margin-bottom:4px}
@keyframes u{from{transform:translateY(30px);opacity:0}}@keyframes f{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-weight:700;padding:11px 16px;border-radius:10px;z-index:99;animation:u .2s;max-width:90vw;text-align:center}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:380px}
.login .brand{font-size:2.6rem}
.chart{width:100%;height:auto;display:block}
.exrow{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.exrow .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.exrow input,.exrow select{padding:9px 10px;font-size:.93rem;background:var(--s1)}
.exrow label{margin:8px 0 4px;font-size:.68rem}
.athl-check{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--s2);margin-bottom:6px;width:100%;text-align:left;border:1px solid var(--line)}
.athl-check.on{border-color:var(--acc)}
.athl-check .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--dim);display:grid;place-items:center;flex:none}
.athl-check.on .bx{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:10px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--mut)}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:1.2em}
</style>
</head>

/* ============================ BACKEND: DEMO (local) ============================ */
class LocalDB{
  constructor(){this.k='mireto_pro_demo_v1';this.sk='mireto_pro_demo_ses';this.mem={};this.d=this._r(this.k)||this.seed();this._w()}

  async registerTrainer(nombre,usuario,pass){usuario=norm(usuario);if(this.d.users.some(u=>u.usuario===usuario))throw new Error('Ese usuario ya existe');const u={id:uid(),rol:'entrenador',nombre,usuario,pass,creado:Date.now()};this.d.users.push(u);this._w();this._s(this.sk,u.id);return this._pub(u)}
  async crearAtleta(me,a){const usuario=norm(a.usuario);if(this.d.users.some(u=>u.usuario===usuario))throw new Error('Ese usuario ya existe');const u={id:uid(),rol:'atleta',entrenadorId:me.id,activo:true,creado:Date.now(),...a,usuario};this.d.users.push(u);this._w();return this._pub(u)}
  async updateUser(id,data){Object.assign(this.d.users.find(u=>u.id===id),data);this._w()}
  async cambiarPass(me,p){this.d.users.find(u=>u.id===me.id).pass=p;this._w()}
  async loadAll(me){const D=this.d,c=x=>JSON.parse(JSON.stringify(x));
    if(me.rol==='entrenador')return c({atletas:D.users.filter(u=>u.entrenadorId===me.id).map(u=>this._pub(u)),entrenos:D.entrenos.filter(x=>x.entrenadorId===me.id),resultados:D.resultados.filter(x=>x.entrenadorId===me.id),retos:D.retos.filter(x=>x.entrenadorId===me.id),intentos:D.intentos.filter(x=>x.entrenadorId===me.id)});
    const t=D.users.find(u=>u.id===me.entrenadorId);
    return c({entrenador:t?{id:t.id,nombre:t.nombre}:null,entrenos:D.entrenos.filter(x=>(x.asignados||[]).includes(me.id)),resultados:D.resultados.filter(x=>x.atletaId===me.id),retos:D.retos.filter(x=>(x.asignados||[]).includes(me.id)),intentos:D.intentos.filter(x=>x.atletaId===me.id)})}
  async put(col,o){o=JSON.parse(JSON.stringify(o));if(!o.id)o.id=uid();const a=this.d[col];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);this._w();return o.id}

  seed(){
    let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};

/* ============================ BACKEND: Firebase ============================ */
class FireDB{
  get demo(){return false}
  async init(){const v='10.14.1',b=`https://cdn.jsdelivr.net/npm/firebase@${v}/`;
    for(const f of['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await new Promise((ok,ko)=>{const s=document.createElement('script');s.src=b+f;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar Firebase'));document.head.appendChild(s)});
    this.app=firebase.initializeApp(FIREBASE_CONFIG);this.auth=firebase.auth();this.fs=firebase.firestore();
    this.sec=firebase.initializeApp(FIREBASE_CONFIG,'secundaria');}
  em(u){return norm(u).replace(/[^a-z0-9._-]/g,'')+'@'+DOMINIO_USUARIOS}
  async _me(u){const s=await this.fs.doc(C('users')+'/'+u.uid).get();if(!s.exists)throw new Error('Cuenta sin perfil. Contacta con tu entrenador.');return{id:u.uid,...s.data()}}
  session(){return new Promise(res=>{const un=this.auth.onAuthStateChanged(async u=>{un();if(!u)return res(null);try{res(await this._me(u))}catch(e){res(null)}})})}
  async login(us,p){try{const c=await this.auth.signInWithEmailAndPassword(this.em(us),p);return await this._me(c.user)}catch(e){throw new Error(e.code&&e.code.startsWith('auth/')?'Usuario o contraseña incorrectos':e.message)}}
  async logout(){await this.auth.signOut()}
  async registerTrainer(nombre,usuario,pass){const c=await this.auth.createUserWithEmailAndPassword(this.em(usuario),pass).catch(fe);const d={rol:'entrenador',nombre,usuario:norm(usuario),creado:Date.now()};await this.fs.doc(C('users')+'/'+c.user.uid).set(d);return{id:c.user.uid,...d}}
  async crearAtleta(me,a){const c=await this.sec.auth().createUserWithEmailAndPassword(this.em(a.usuario),a.pass).catch(fe);const id=c.user.uid;await this.sec.auth().signOut();
    const{pass,...rest}=a;const d={rol:'atleta',entrenadorId:me.id,activo:true,creado:Date.now(),...rest,usuario:norm(a.usuario)};await this.fs.doc(C('users')+'/'+id).set(d);return{id,...d}}
  async updateUser(id,data){await this.fs.doc(C('users')+'/'+id).update(data)}
  async cambiarPass(me,p){await this.auth.currentUser.updatePassword(p).catch(fe)}
  _q(col,f,op,v){return this.fs.collection(col).where(f,op,v).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()})))}
  async loadAll(me){
    if(me.rol==='entrenador'){const[atletas,entrenos,resultados,retos,intentos]=await Promise.all([this._q(C('users'),'entrenadorId','==',me.id),this._q(C('entrenos'),'entrenadorId','==',me.id),this._q(C('resultados'),'entrenadorId','==',me.id),this._q(C('retos'),'entrenadorId','==',me.id),this._q(C('intentos'),'entrenadorId','==',me.id)]);return{atletas,entrenos,resultados,retos,intentos}}
    const[t,entrenos,resultados,retos,intentos]=await Promise.all([this.fs.doc(C('users')+'/'+me.entrenadorId).get(),this._q(C('entrenos'),'asignados','array-contains',me.id),this._q(C('resultados'),'atletaId','==',me.id),this._q(C('retos'),'asignados','array-contains',me.id),this._q(C('intentos'),'atletaId','==',me.id)]);
    return{entrenador:t.exists?{id:t.id,nombre:t.data().nombre}:null,entrenos,resultados,retos,intentos}}
  async put(col,o){col=C(col);const id=o.id||this.fs.collection(col).doc().id;const{id:_,...rest}=JSON.parse(JSON.stringify(o));await this.fs.doc(col+'/'+id).set(rest);return id}
  async del(col,id){col=C(col);await this.fs.doc(col+'/'+id).delete()}
}

const ent=id=>D.entrenos.find(e=>e.id===id);

function adherencia(aid){const hoy=HOY();const as=D.entrenos.filter(e=>e.fecha<=hoy&&(e.asignados||[]).includes(aid));if(!as.length)return null;const h=as.filter(e=>resDe(e.id,aid)).length;return{h,t:as.length,p:Math.round(h/as.length*100)}}
function alertasDe(r){const a=[];if(r.dolor)a.push(['bad','Molestia']);if(r.rpe>=9)a.push(['warn','RPE '+r.rpe]);if(r.energia&&r.energia<=1)a.push(['warn','Sin energía']);return a}
function series(aid){const m={};D.resultados.filter(r=>r.atletaId===aid).forEach(r=>{const e=ent(r.entrenoId);if(!e)return;e.ej.forEach((x,j)=>{if(x.u==='-')return;const v=num(r.valores?.[j]?.v);if(v==null)return;const k=norm(x.n)+'|'+x.u;(m[k]=m[k]||{n:x.n,u:x.u,mejor:x.mejor,pts:[]}).pts.push({f:r.fecha,v})})});Object.values(m).forEach(s=>s.pts.sort((a,b)=>a.f.localeCompare(b.f)));return Object.entries(m).map(([k,s])=>({k,...s})).sort((a,b)=>b.pts.length-a.pts.length)}
const best=(s)=>s.pts.reduce((b,p)=>b==null?p.v:(s.mejor==='menos'?Math.min(b,p.v):Math.max(b,p.v)),null);
const bestInt=(reto,aid)=>{const a=D.intentos.filter(i=>i.retoId===reto.id&&i.atletaId===aid);if(!a.length)return null;return a.reduce((b,i)=>reto.mejor==='menos'?Math.min(b,i.valor):Math.max(b,i.valor),a[0].valor)};
const logrado=(reto,v)=>v!=null&&reto.objetivo!=null&&(reto.mejor==='menos'?v<=reto.objetivo:v>=reto.objetivo);

function formAtleta(id){const a=id?atl(id):{};sheet(`<h2>${id?'Editar atleta':'Nuevo atleta'}</h2><p class="mut sm">${id?'':'Crea su acceso: tú le das el usuario y la contraseña.'}</p>

  <button class="btn pri full" style="margin-top:18px" id="faOk">${id?'Guardar':'Crear atleta'}</button><div class="err" id="faE"></div>`);
  let activo=a.activo!==false;if(id){$('#faA1').onclick=()=>{activo=true;$('#faA1').classList.add('on');$('#faA0').classList.remove('on')};$('#faA0').onclick=()=>{activo=false;$('#faA0').classList.add('on');$('#faA1').classList.remove('on')}}
  $('#faOk').onclick=async()=>{const n=$('#faN').value.trim();if(!n){$('#faE').textContent='Escribe el nombre';return}const data={nombre:n,nacimiento:$('#faF').value,notas:$('#faO').value.trim()};
    $('#faOk').disabled=true;
    try{if(id){await db.updateUser(id,{...data,activo})}else{const u=$('#faU').value.trim(),p=$('#faP').value;if(!u||p.length<6)throw new Error('Usuario y contraseña (mín. 6) obligatorios');const na=await db.crearAtleta(ME,{...data,usuario:u,pass:p});cerrar();await recargar();render();credenciales(na.nombre,na.usuario,p);return}

function credenciales(n,u,p){const t=`Hola ${n.split(' ')[0]}, este es tu acceso a MAMBAFIT Entrenos (puedes instalarla en el móvil con "Añadir a pantalla de inicio"):\n${location.href.split('#')[0]}\nUsuario: ${u}\nContraseña: ${p}`;
  sheet(`<h2>Atleta creado</h2><p class="mut">Envíale estos datos de acceso (a él o a su familia):</p><textarea id="crT" readonly style="min-height:110px">${esc(t)}</textarea>

async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){const x=$('#crT')||$('textarea[readonly]');x&&x.select();toast('Selecciona y copia')}}

function tAtleta({id}){const a=atl(id);if(!a)return'<div class="empty">Atleta no encontrado</div>';
  const ad=adherencia(id);const rs=D.resultados.filter(r=>r.atletaId===id).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  const ult=rs.slice(0,8);const rpe=avg(ult.map(r=>r.rpe).filter(Boolean)),ene=avg(ult.map(r=>r.energia).filter(Boolean));

  const ss=series(id);
  return PH(esc(a.nombre),`@${esc(a.usuario)}${edad!=null?` · ${edad} años`:''}${a.activo===false?' · inactivo':''}`,`<button class="btn sm ghost" onclick="formAtleta('${id}')">${ic('edit',16)} Editar</button>`,true)+`

  <div class="kpis"><div class="kpi"><div class="v">${ad?ad.p:'–'}<small>${ad?'%':''}</small></div><div class="l">Cumplimiento${ad?` (${ad.h}/${ad.t})`:''}</div></div>
   <div class="kpi"><div class="v">${rs.length}</div><div class="l">Entrenos registrados</div></div>

   <div class="kpi"><div class="v">${ene?r1(ene):'–'}<small>/5</small></div><div class="l">Energía media (últ. 8)</div></div></div>
  ${chartCard(ss,'atl_'+id)}
  ${ult.length?`<div class="card"><h3>Carga percibida (RPE)</h3><div data-chart="rpe" data-a="${id}"></div></div>`:''}
  <div class="card"><h3>Historial</h3><div class="list">${rs.length?rs.map(r=>{const e=ent(r.entrenoId);if(!e)return'';const al=alertasDe(r);return`<button class="row" onclick="verRes('${r.id}')">${dateBox(r.fecha)}<div class="m"><b>${esc(e.titulo)}</b><small>RPE ${r.rpe||'–'} · energía ${r.energia||'–'}/5${r.comentario?' · “'+esc(r.comentario.slice(0,40))+'”':''}</small></div><div class="btns" style="gap:4px">${al.map(([c,t])=>`<span class="tag ${c}">${t}</span>`).join('')}</div></button>`}).join(''):'<div class="empty">Sin registros todavía.</div>'}</div></div>
  <button class="btn ghost full" onclick="credInfo('${id}')">Datos de acceso</button>`}
function credInfo(id){const a=atl(id);sheet(`<h2>Acceso de ${esc(a.nombre.split(' ')[0])}</h2><p>Usuario: <b>${esc(a.usuario)}</b></p><p class="mut sm">La contraseña no se guarda visible. Si la ha olvidado: ${db.demo?'en demo es demo123.':'restablécela desde la consola de Firebase (Authentication → usuario '+esc(a.usuario)+'@'+DOMINIO_USUARIOS+'), o pídele que la cambie desde "Mi cuenta" si aún puede entrar.'}</p><button class="btn full" onclick="cerrar()">Cerrar</button>`)}

function chartCard(ss,key){if(!ss.length)return`<div class="card"><h3>Evolución</h3><div class="empty">Cuando registre resultados numéricos verás aquí su evolución.</div></div>`;
  if(!UI.exSel||!ss.find(s=>s.k===UI.exSel))UI.exSel=ss[0].k;const s=ss.find(x=>x.k===UI.exSel);const b=best(s);const first=s.pts[0].v,last=s.pts[s.pts.length-1].v;
  const dif=r1(last-first);const mej=s.pts.length>1&&(s.mejor==='menos'?dif<0:dif>0);
  return`<div class="card"><h3>Evolución por ejercicio</h3><div class="pills" style="margin-bottom:12px">${ss.slice(0,12).map(x=>`<button class="${x.k===UI.exSel?'on':''}" data-k="${esc(x.k)}" onclick="UI.exSel=this.dataset.k;render()">${esc(x.n)}</button>`).join('')}</div>
   <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px"><div><div class="mut sm">Mejor marca</div><div class="cond" style="font-size:1.5rem;color:var(--acc)">${b} ${uTxt(s.u)}</div></div><div><div class="mut sm">Última</div><div class="cond" style="font-size:1.5rem">${last} ${uTxt(s.u)}</div></div><div><div class="mut sm">Desde el inicio</div><div class="cond" style="font-size:1.5rem;color:${s.pts.length<2?'var(--mut)':mej?'var(--ok)':'var(--warn)'}">${s.pts.length<2?'–':(dif>0?'+':'')+dif}</div></div></div>
   <div data-chart="ex" data-s='${esc(JSON.stringify(s))}'></div><div class="mut sm">${s.mejor==='menos'?'En este ejercicio, menos es mejor.':''}</div></div>`}

    :`<div class="inrow"><input type="number" step="any" inputmode="decimal" value="${esc(v.v)}" placeholder="Tu resultado" oninput="REG.valores[${j}].v=this.value"><span class="unit">${x.u}</span></div>`}

  <div class="card"><h3>Sensaciones</h3>
   <label>Esfuerzo percibido (RPE) · <span id="rpeT" style="color:var(--acc)">${RPE_TXT[REG.rpe]||''}</span></label>${scale('rpe',10,'Muy fácil','Máximo')}

async function guardarReg(){const e=ent(REG._id);if(!REG.rpe){toast('Indica el esfuerzo (RPE)');return}

  if(!await guardar(()=>db.put('resultados',o)))return;
  const nuevos=[];e.ej.forEach((x,j)=>{const v=o.valores[j].v;if(v==null)return;const s=antes.find(s=>s.k===norm(x.n)+'|'+x.u);if(s&&s.pts.length){const b=best(s);if(x.mejor==='menos'?v<b:v>b)nuevos.push(`${x.n}: ${v} ${x.u}`)}});

function aProgreso(){const ss=series(ME.id);const rs=D.resultados;const ad=adherenciaA();const rpe=avg(rs.slice(-8).map(r=>r.rpe).filter(Boolean));
  const hoy=HOY();let wk=lunes(hoy);const sem=[];for(let i=0;i<8;i++){const f=addDays(wk,6);sem.unshift({l:wk,n:rs.filter(r=>r.fecha>=wk&&r.fecha<=f).length});wk=addDays(wk,-7)}const mx=Math.max(3,...sem.map(s=>s.n));

function aRetos(){const hoy=HOY();const act=D.retos.filter(r=>!r.fin||r.fin>=hoy),pas=D.retos.filter(r=>r.fin&&r.fin<hoy);

async function intento(rid){const r=D.retos.find(x=>x.id===rid);const v=num($('#it_'+rid).value);if(v==null||v<=0){toast('Escribe un valor válido');return}

/* ============================ gráficas ============================ */
function dibujar(el){const W=360,H=170,L=34,R=14,T=22,B=26;let pts,inv=false,u='';
  if(el.dataset.chart==='ex'){const s=JSON.parse(el.dataset.s);pts=s.pts;inv=s.mejor==='menos';u=s.u}
  else{pts=D.resultados.filter(r=>r.atletaId===el.dataset.a&&r.rpe).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-12).map(r=>({f:r.fecha,v:r.rpe}))}
  if(pts.length<2){el.innerHTML=`<div class="mut sm" style="padding:10px 0">${pts.length?'Una sola marca registrada ('+pts[0].v+' '+uTxt(u)+'). Con el siguiente registro verás la tendencia.':'Sin datos'}</div>`;return}
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(el.dataset.chart==='rpe'){lo=0;hi=10}else{const pd=(hi-lo||1)*.2;lo-=pd;hi+=pd}
  const x=i=>L+i*(W-L-R)/(pts.length-1);const fr=v=>(v-lo)/(hi-lo);const y=v=>inv?T+fr(v)*(H-T-B):H-B-fr(v)*(H-T-B);
  const ticks=[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15];const fmt=v=>Math.abs(v)<20?r1(v):Math.round(v);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  const area=path+` L${x(pts.length-1)},${H-B} L${x(0)},${H-B} Z`;
  const step=Math.ceil(pts.length/6);
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3262e" stop-opacity=".28"/><stop offset="1" stop-color="#e3262e" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#2a3441" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(t)+4}" fill="#5d6878" font-size="10" text-anchor="end" font-family="Barlow">${fmt(t)}</text>`).join('')}
   <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#e3262e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#0d1117" stroke="#e3262e" stroke-width="2"/>${i===pts.length-1?`<text x="${x(i)}" y="${y(p.v)-10}" fill="#e6ebf1" font-size="12" font-weight="700" text-anchor="end" font-family="Barlow">${p.v}</text>`:''}${i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${H-6}" fill="#5d6878" font-size="10" text-anchor="middle" font-family="Barlow">${fD(p.f,{day:'numeric',month:'numeric'})}</text>`:''}`).join('')}</svg>`}

/* ============================ arranque ============================ */
(async()=>{try{await db.init();ME=await db.session();if(ME)await recargar()}catch(e){$('#app').innerHTML=`<div class="loading"><div style="text-align:center;padding:20px"><h2>No se pudo iniciar</h2><p class="mut">${esc(e.message)}</p></div></div>`;return}render()})();
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
